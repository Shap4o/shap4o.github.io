<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С Днём Аплифта</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 20% 20%, #ff00ff 0 12%, transparent 13%),
      radial-gradient(circle at 80% 30%, #00ffff 0 10%, transparent 11%),
      radial-gradient(circle at 30% 80%, #ffff00 0 14%, transparent 15%),
      radial-gradient(circle at 70% 70%, #00ff00 0 9%, transparent 10%),
      repeating-linear-gradient(45deg, #ff66cc 0 24px, #66ccff 24px 48px);
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    padding: 20px;
    overflow: hidden;
  }

  .card {
    width: 460px;
    background: #fffbe6;
    border: 10px solid #00ff00;
    border-radius: 30px;
    box-shadow: 0 0 0 10px #ffff00, 0 0 0 18px #ff00ff, 0 22px 44px rgba(0,0,0,.45);
    padding: 18px 16px 16px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* радуга */
  .rainbow {
    position: absolute;
    top: -160px;
    left: 50%;
    transform: translateX(-50%);
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: conic-gradient(red, orange, yellow, green, blue, indigo, violet, red);
    opacity: .4;
    z-index: 0;
    pointer-events: none;
    animation: spin 18s linear infinite;
  }
  @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }

  .content { position: relative; z-index: 3; }

  /* ---- ряд животных ---- */
  .pets {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 4px;
    margin-bottom: 4px;
  }
  .pet {
    font-size: 46px;
    line-height: 1;
    display: inline-block;
    animation: bounce 1.6s ease-in-out infinite;
    filter: drop-shadow(2px 2px 0 #ff00ff);
  }
  .pet:nth-child(1) { animation-delay: 0s;   font-size: 38px; }
  .pet:nth-child(2) { animation-delay: .15s; font-size: 52px; }
  .pet:nth-child(3) { animation-delay: .3s;  font-size: 44px; }
  .pet:nth-child(4) { animation-delay: .45s; font-size: 56px; }
  .pet:nth-child(5) { animation-delay: .6s;  font-size: 38px; }
  .pet:nth-child(6) { animation-delay: .75s; font-size: 50px; }
  .pet:nth-child(7) { animation-delay: .9s;  font-size: 40px; }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-12px) rotate(5deg); }
  }

  /* ---- смайлики-графики ---- */
  .charts {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 8px 0 6px;
  }
  .chart {
    font-size: 34px;
    display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
    filter: drop-shadow(0 0 6px #00ff88);
  }
  .chart:nth-child(2) { animation-delay: .2s; }
  .chart:nth-child(3) { animation-delay: .4s; }
  .chart:nth-child(4) { animation-delay: .6s; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }

  h1 {
    font-size: 40px;
    line-height: 1.02;
    color: #ff0000;
    text-transform: uppercase;
    text-shadow: 3px 3px 0 #ffff00, 6px 6px 0 #00ffff, 9px 9px 0 #ff00ff;
    margin: 6px 0 12px;
    letter-spacing: 1px;
  }

  /* ---- летающая ерунда ---- */
  .float {
    position: absolute;
    font-size: 30px;
    z-index: 2;
    animation: floaty 3s ease-in-out infinite;
    pointer-events: none;
    user-select: none;
  }
  .f1 { top: 10px;  left: 12px;  animation-delay: 0s; }
  .f2 { top: 16px;  right: 14px; animation-delay: .4s; }
  .f3 { bottom: 12px; left: 18px; animation-delay: .8s; }
  .f4 { bottom: 8px;  right: 12px; animation-delay: 1.2s; }
  .f5 { top: 44%; left: -4px; animation-delay: .6s; font-size: 26px; }
  .f6 { top: 52%; right: -2px; animation-delay: 1s; font-size: 26px; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-10deg); }
    50% { transform: translateY(-14px) rotate(10deg); }
  }

  /* пиксельные звёздочки */
  .sparkle {
    position: absolute;
    font-size: 20px;
    animation: blink 1s steps(2) infinite;
    z-index: 2;
  }
  .s1 { top: 70px; left: 64px; }
  .s2 { top: 100px; right: 58px; animation-delay: .3s; }
  .s3 { bottom: 90px; left: 46px; animation-delay: .6s; }
  .s4 { bottom: 70px; right: 70px; animation-delay: .9s; }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rainbow"></div>

    <!-- летающая ерунда -->
    <div class="float f1">🐸</div>
    <div class="float f2">🍕</div>
    <div class="float f3">🦆</div>
    <div class="float f4">🧀</div>
    <div class="float f5">🌈</div>
    <div class="float f6">✨</div>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✧</div>

    <div class="content">
      <!-- животные -->
      <div class="pets">
        <span class="pet">🐱</span>
        <span class="pet">🐶</span>
        <span class="pet">🐈</span>
        <span class="pet">🐕</span>
        <span class="pet">🐱</span>
        <span class="pet">🐶</span>
        <span class="pet">🐈‍⬛</span>
      </div>

      <!-- смайлики-графики -->
      <div class="charts">
        <span class="chart">📈</span>
        <span class="chart">💹</span>
        <span class="chart">📊</span>
        <span class="chart">📉</span>
      </div>

      <h1>С Днём<br>Аплифта</h1>
    </div>
  </div>
</body>
</html>
