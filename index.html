<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>С Днём Аплифта</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: repeating-linear-gradient(
      45deg,
      #ff00ff 0 20px,
      #00ffff 20px 40px
    );
    font-family: "Comic Sans MS", "Comic Sans", cursive, sans-serif;
    padding: 20px;
    overflow: hidden;
  }
  .card {
    width: 420px;
    background: #fffbe6;
    border: 10px solid #00ff00;
    border-radius: 30px;
    box-shadow: 0 0 0 10px #ffff00, 0 20px 40px rgba(0,0,0,.4);
    padding: 20px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* радуга сверху */
  .rainbow {
    position: absolute;
    top: -140px;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: conic-gradient(
      red, orange, yellow, green, blue, indigo, violet, red
    );
    opacity: .45;
    z-index: 0;
    pointer-events: none;
  }

  .content { position: relative; z-index: 2; }

  /* летающие эмодзи-приколы */
  .float {
    position: absolute;
    font-size: 34px;
    z-index: 1;
    animation: floaty 3s ease-in-out infinite;
    pointer-events: none;
    user-select: none;
  }
  .f1 { top: 8px;  left: 10px;  animation-delay: 0s; }
  .f2 { top: 18px; right: 14px; animation-delay: .4s; }
  .f3 { bottom: 14px; left: 16px; animation-delay: .8s; }
  .f4 { bottom: 8px; right: 10px; animation-delay: 1.2s; }
  .f5 { top: 120px; left: -6px; animation-delay: .6s; font-size: 28px; }
  .f6 { top: 150px; right: -4px; animation-delay: 1s; font-size: 28px; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50% { transform: translateY(-12px) rotate(8deg); }
  }

  /* главный кот */
  .cat {
    font-size: 96px;
    line-height: 1;
    display: inline-block;
    animation: wiggle 1.4s ease-in-out infinite;
    filter: drop-shadow(3px 3px 0 #ff00ff);
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg) scale(1); }
    50% { transform: rotate(6deg) scale(1.06); }
  }

  h1 {
    font-size: 40px;
    line-height: 1.05;
    color: #ff0000;
    text-transform: uppercase;
    text-shadow: 3px 3px 0 #ffff00, 6px 6px 0 #00ffff, 9px 9px 0 #ff00ff;
    margin: 10px 0 16px;
    letter-spacing: 1px;
  }

  /* пиксельные звёздочки */
  .sparkle {
    position: absolute;
    font-size: 22px;
    animation: blink 1s steps(2) infinite;
    z-index: 1;
  }
  .s1 { top: 60px; left: 70px; }
  .s2 { top: 90px; right: 60px; animation-delay: .3s; }
  .s3 { bottom: 70px; left: 50px; animation-delay: .6s; }
  .s4 { bottom: 50px; right: 80px; animation-delay: .9s; }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* бегущая строка из ерунды */
  .marquee {
    margin-top: 14px;
    border-top: 3px dashed #ff00ff;
    border-bottom: 3px dashed #ff00ff;
    overflow: hidden;
    white-space: nowrap;
    background: #ffff99;
    padding: 6px 0;
    font-size: 14px;
    color: #0000ff;
    font-weight: bold;
  }
  .marquee span {
    display: inline-block;
    padding-left: 100%;
    animation: scroll 12s linear infinite;
  }
  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-100%); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="rainbow"></div>

    <!-- ерунда -->
    <div class="float f1">🐸</div>
    <div class="float f2">🍕</div>
    <div class="float f3">🦆</div>
    <div class="float f4">🧀</div>
    <div class="float f5">🌈</div>
    <div class="float f6">✨</div>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✧</div>

    <div class="content">
      <div class="cat">🐱</div>
      <h1>С Днём<br>Аплифта</h1>

      <div class="marquee">
        <span>🌈 аплифт 🌈 аплифт 🌈 аплифт 🌈 аплифт 🌈 аплифт 🌈 аплифт 🌈</span>
      </div>
    </div>
  </div>
</body>
</html>
